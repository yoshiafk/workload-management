version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hr-management-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hr_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: hr-management-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-hr_management}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      PORT: 3000
      FRONTEND_URL: http://localhost
      NODE_ENV: production
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: hr-management-frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend

volumes:
  postgres_data:
